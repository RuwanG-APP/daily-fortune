<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#6b3416" />
      <stop offset="65%" stop-color="#431f0e" />
      <stop offset="100%" stop-color="#271107" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="48%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Tile Backdrop -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="100" ry="100" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.35" stroke-width="4" />

  <!-- Subtle 12-House Celestial Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.65" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 10" />

  <!-- 12 Hour/Rashi Tick Dots -->
  <g fill="#fde68a" opacity="0.85">
    <circle cx="256" cy="70" r="5" />
    <circle cx="349" cy="95" r="4" />
    <circle cx="417" cy="163" r="4" />
    <circle cx="442" cy="256" r="5" />
    <circle cx="417" cy="349" r="4" />
    <circle cx="349" cy="417" r="4" />
    <circle cx="256" cy="442" r="5" />
    <circle cx="163" cy="417" r="4" />
    <circle cx="95" cy="349" r="4" />
    <circle cx="70" cy="256" r="5" />
    <circle cx="95" cy="163" r="4" />
    <circle cx="163" cy="95" r="4" />
  </g>

  <!-- Secondary Diagonal Compass Rays -->
  <g filter="url(#softGlow)">
    <polygon points="256,120 278,234 392,256 278,278 256,392 234,278 120,256 234,234" fill="#d97706" opacity="0.85" transform="rotate(45 256 256)" />
    <!-- Primary Cardinal Golden Starburst -->
    <polygon points="256,88 286,226 424,256 286,286 256,424 226,286 88,256 226,226" fill="url(#goldGrad)" />
  </g>

  <!-- Luminous Inner Sun Wheel -->
  <circle cx="256" cy="256" r="70" fill="#3b1a0b" stroke="#fef08a" stroke-width="5" />
  <circle cx="256" cy="256" r="52" fill="url(#coreGrad)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.92" />
</svg>
